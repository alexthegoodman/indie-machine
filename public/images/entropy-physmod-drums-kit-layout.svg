<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="sans-serif"><rect width="100%" height="100%" fill="#f7f6f2"/><rect x="40" y="30" width="640" height="368" fill="#ffffff" stroke="#c9c4b8"/><line x1="40.0" y1="30" x2="40.0" y2="398" stroke="#ece8de"/><text x="40.0" y="411.0" font-size="10" fill="#55524a" text-anchor="middle">-1</text><line x1="200.0" y1="30" x2="200.0" y2="398" stroke="#ece8de"/><text x="200.0" y="411.0" font-size="10" fill="#55524a" text-anchor="middle">-0.5</text><line x1="360.0" y1="30" x2="360.0" y2="398" stroke="#ece8de"/><text x="360.0" y="411.0" font-size="10" fill="#55524a" text-anchor="middle">0</text><line x1="520.0" y1="30" x2="520.0" y2="398" stroke="#ece8de"/><text x="520.0" y="411.0" font-size="10" fill="#55524a" text-anchor="middle">0.5</text><line x1="680.0" y1="30" x2="680.0" y2="398" stroke="#ece8de"/><text x="680.0" y="411.0" font-size="10" fill="#55524a" text-anchor="middle">1</text><text x="40.0" y="22.0" font-size="13" fill="#2a2925" text-anchor="start" font-weight="bold">The kit from above: one layout drives the sound and the view</text><text x="360.0" y="426.0" font-size="11" fill="#55524a" text-anchor="middle">x, m (listener's right)</text><text transform="translate(0,214) rotate(-90)" font-size="11" fill="#55524a" text-anchor="middle"></text><circle cx="360.0" cy="196.4" r="89.4" fill="none" stroke="#1f5f8b" stroke-width="1.8" stroke-dasharray=""/><text x="360.0" y="200.4" font-size="10" fill="#1f5f8b" text-anchor="middle" font-weight="bold">kick</text><circle cx="232.0" cy="142.0" r="56.9" fill="none" stroke="#1f5f8b" stroke-width="1.8" stroke-dasharray=""/><text x="232.0" y="146.0" font-size="10" fill="#1f5f8b" text-anchor="middle" font-weight="bold">snare</text><circle cx="315.2" cy="231.6" r="48.8" fill="none" stroke="#1f5f8b" stroke-width="1.8" stroke-dasharray=""/><text x="315.2" y="235.6" font-size="10" fill="#1f5f8b" text-anchor="middle" font-weight="bold">rack-tom</text><circle cx="510.4" cy="161.2" r="65.0" fill="none" stroke="#1f5f8b" stroke-width="1.8" stroke-dasharray=""/><text x="510.4" y="165.2" font-size="10" fill="#1f5f8b" text-anchor="middle" font-weight="bold">floor-tom</text><circle cx="155.2" cy="270.0" r="65.0" fill="none" stroke="#7a4b1e" stroke-width="1.8" stroke-dasharray="5 3"/><text x="155.2" y="274.0" font-size="10" fill="#7a4b1e" text-anchor="middle" font-weight="bold">crash</text><circle cx="577.6" cy="257.2" r="81.3" fill="none" stroke="#7a4b1e" stroke-width="1.8" stroke-dasharray="5 3"/><text x="577.6" y="261.2" font-size="10" fill="#7a4b1e" text-anchor="middle" font-weight="bold">ride</text><circle cx="411.2" cy="295.6" r="40.6" fill="none" stroke="#7a4b1e" stroke-width="1.8" stroke-dasharray="5 3"/><text x="411.2" y="299.6" font-size="10" fill="#7a4b1e" text-anchor="middle" font-weight="bold">splash</text><line x1="315.2" y1="231.6" x2="232.0" y2="142.0" stroke="#b5462d" stroke-dasharray="2 3"/><text x="273.6" y="181.8" font-size="10" fill="#b5462d" text-anchor="middle">56 samples to the snare</text><line x1="360.0" y1="196.4" x2="232.0" y2="142.0" stroke="#b5462d" stroke-dasharray="2 3"/><text x="296.0" y="164.2" font-size="10" fill="#b5462d" text-anchor="middle">86 samples to the snare</text><line x1="510.4" y1="161.2" x2="232.0" y2="142.0" stroke="#b5462d" stroke-dasharray="2 3"/><text x="371.2" y="146.6" font-size="10" fill="#b5462d" text-anchor="middle">116 samples to the snare</text><text x="46.0" y="392.0" font-size="10" fill="#8a867a" text-anchor="start">listener side. circles are each piece's own radius. sound travel in samples at 44.1 kHz (a block is 32).</text></svg>